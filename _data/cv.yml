- title: Profile
  type: list
  contents:
    - I'm a computer scientist with a deep appreciation for the role of solid
      engineering in meaningful research. I hold a B.S. in physics and an M.S. in
      computer science, and I spent over three years in industry, giving me an
      academic foundation rooted in real-world software design and maintenance. I then
      transitioned into R&D and Ph.D. work. I now have over five years of experience in
      HPC research and have found great fulfillment in teaching, starting as a lab
      instructor and lecturer, and advancing to an adjunct professor role.
    - I consider it essential to balance innovation and novelty with grounded software
      practices. This view comes from my industry experience and is sustained by a
      genuine passion for exciting ideas that deliver practical impact. I work well in
      collaborative, high-pressure environments, and when teaching, I focus on
      integrating tangible skills and real-world projects with core computer science
      principles.

